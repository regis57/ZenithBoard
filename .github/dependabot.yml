# Keeps the pinned action commits current: Dependabot opens a pull request when one of them has a new release,
# with the new commit and its version comment. Nothing else in this project has dependencies to follow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI"
    # CodeQL's init and analyze must run the same release: bumped one by one (#248, #249, 1 November 2026),
    # each pull request ran a mismatched pair and failed. One pull request for both.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
