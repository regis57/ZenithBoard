name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"          # Mondays, so a rule added after a merge is still noticed

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write       # to file what it finds under Security -> Code scanning
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Third-party code kept unchanged on purpose (flightinfo/static/vendor/README.txt: qrcode-generator 1.4.4,
          # MIT, with its checksum): its style notes (a missing semicolon) are not ours to change. 0.40.1.
          config: |
            paths-ignore:
              - flightinfo/static/vendor
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
        with:
          category: /language:${{ matrix.language }}
