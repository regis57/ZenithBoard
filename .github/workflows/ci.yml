name: CI
on: [push, pull_request]

# Actions are pinned to a commit, not a tag: a tag can be moved to other code, and these run with a token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: shellcheck
        run: shellcheck -x -S warning install.sh bin/zenithboard bin/zenithboard-demo lib/*.sh tests/*.sh tools/*.sh
      - name: What the split-flap picture needs, as a Pi installs it (Pillow, the DejaVu fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil fonts-dejavu-core
      - name: Python tests
        run: |
          python3 -m unittest discover -s tests -v
      - name: Hardware detection and update tests
        run: |
          bash tests/test_hardware.sh
          bash tests/test_update_sync.sh
          bash tests/test_update_verify.sh
          bash tests/test_docs.sh
          bash tests/test_units.sh
          bash tests/test_patches.sh
          bash tests/test_security.sh
          bash tests/test_stats.sh
          bash tests/test_social.sh
          bash tests/test_settings.sh
          bash tests/test_versions.sh
          bash tests/test_fr24_key.sh
          bash tests/test_radarbox.sh
          bash tests/test_telegram.sh
          bash tests/test_logs_uat.sh
          bash tests/test_wifi.sh
          bash tests/test_network.sh
          bash tests/test_gain.sh
          bash tests/test_reliability.sh
          bash tests/test_menus.sh
          bash tests/test_legacy.sh
          bash tests/test_graphs.sh
          bash tests/test_install.sh
          bash tests/test_console.sh
          bash tests/test_backup.sh
          bash tests/test_tailscale.sh
          bash tests/test_adsbx_stats.sh
          bash tests/test_i18n.sh
      - name: JavaScript tests
        run: |
          node tests/test_format.js
          node tests/test_shapes.js
          node tests/test_scene.js
          node tests/test_flap.js
          node tests/test_layout.js
          node tests/test_flags.js
          node tests/test_scroll.js
          node tests/test_statsjs.js
          node tests/test_i18n.js
