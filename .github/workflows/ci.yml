name: CI
on: [push, pull_request]

# Actions are pinned to a commit, not a tag: a tag can be moved to other code, and these run with a token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: shellcheck
        run: shellcheck -x -S warning install.sh bin/zenithboard bin/run-acarsdec bin/zenithboard-demo lib/*.sh tests/*.sh tools/*.sh
      - name: Python tests
        run: |
          python3 -m unittest discover -s tests -v
      - name: Hardware detection and update tests
        run: |
          bash tests/test_hardware.sh
          bash tests/test_update_sync.sh
          bash tests/test_versions.sh
          bash tests/test_fr24_key.sh
          bash tests/test_logs_uat.sh
          bash tests/test_wifi.sh
          bash tests/test_network.sh
          bash tests/test_gain.sh
          bash tests/test_reliability.sh
          bash tests/test_menus.sh
      - name: JavaScript tests
        run: |
          node tests/test_format.js
          node tests/test_shapes.js
          node tests/test_scene.js
          node tests/test_flap.js
          node tests/test_layout.js
