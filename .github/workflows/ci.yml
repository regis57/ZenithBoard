name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S warning install.sh bin/zenithboard bin/run-acarsdec bin/zenithboard-demo lib/*.sh tests/*.sh
      - name: Python tests
        run: |
          sudo apt-get install -y python3-pil
          python3 -m unittest discover -s tests -v
      - name: Hardware detection tests
        run: bash tests/test_hardware.sh
      - name: JavaScript tests
        run: |
          node tests/test_format.js
          node tests/test_shapes.js
