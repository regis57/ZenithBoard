name: Download links
on:
  schedule:
    - cron: "17 6 1 * *"       # the 1st of each month
  workflow_dispatch:            # and whenever you want to check by hand

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write             # only to open the one issue below
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Are the pinned downloads still there?
        id: check
        run: |
          set +e
          bash tools/check-links.sh | tee result.txt
          echo "failed=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open an issue if one has moved
        if: steps.check.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "A pinned download address no longer answers"
        run: |
          # one open issue at a time: a second month of the same problem comments instead of opening another
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          body=$(printf 'The monthly check found an address in `lib/versions.sh` that no longer answers.\n\nAn install will stop with a 404 here until the version or the URL is updated.\n\n```\n%s\n```\n\nRun: %s\n' "$(cat result.txt)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
